<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>鹈鹕骑自行车 · SVG 2D 动画</title>
  <style>
    :root { color-scheme: light; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; overflow: hidden; background: linear-gradient(180deg, #a8e8ff 0%, #d9f6ff 60%, #86d39d 60%, #5db579 100%); }
    .stage { width: min(1100px, 96vw); aspect-ratio: 16 / 9; position: relative; overflow: hidden; border: 3px solid rgba(17,68,83,.18); border-radius: 28px; background: linear-gradient(#a8e8ff 0 59%, #8bd99f 59% 100%); box-shadow: 0 24px 70px rgba(28,86,96,.25); }
    svg { width: 100%; height: 100%; display: block; }
    .title { position: absolute; left: 28px; top: 22px; color: #165267; font-weight: 800; letter-spacing: .08em; font-size: clamp(15px,2vw,25px); }
    .hint { position: absolute; right: 28px; bottom: 20px; color: rgba(22,82,103,.72); font-size: 13px; }
    .cloud { animation: drift 18s linear infinite; } .cloud.slow { animation-duration: 28s; animation-delay: -8s; }
    .tree { transform-origin: center bottom; animation: sway 2.8s ease-in-out infinite; } .tree:nth-child(2n) { animation-delay: -.9s; animation-duration: 3.3s; }
    .road-mark { animation: road 1.6s linear infinite; } .road-mark.delay { animation-delay: -.8s; }
    .bike { animation: ride 1.15s ease-in-out infinite; transform-origin: 50% 75%; }
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin .9s linear infinite; }
    .wing { transform-box: fill-box; transform-origin: 18% 82%; animation: flap 1.15s ease-in-out infinite; }
    .leg { transform-box: fill-box; transform-origin: 50% 8%; animation: pedal 1.15s linear infinite; } .leg.back { animation-delay: -.575s; }
    .foot { transform-box: fill-box; transform-origin: 50% 50%; animation: pedal-foot 1.15s linear infinite; } .foot.back { animation-delay: -.575s; }
    .beak { transform-box: fill-box; transform-origin: 0 50%; animation: bob 1.15s ease-in-out infinite; }
    @keyframes drift { from { transform: translateX(-28%); } to { transform: translateX(130%); } }
    @keyframes sway { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
    @keyframes road { from { transform: translateX(0); } to { transform: translateX(-190px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes ride { 0%,100% { transform: translateY(0) rotate(-.5deg); } 50% { transform: translateY(-4px) rotate(.5deg); } }
    @keyframes flap { 0%,100% { transform: rotate(4deg); } 50% { transform: rotate(-13deg); } }
    @keyframes pedal { to { transform: rotate(360deg); } } @keyframes pedal-foot { to { transform: rotate(-360deg); } }
    @keyframes bob { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-3deg); } }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; } }
  </style>
</head>
