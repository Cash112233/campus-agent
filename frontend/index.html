<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>校园小助手</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
<style>
:root{
  --primary:#3b82f6; --primary-dark:#2563eb; --primary-light:#eff6ff;
  --bg:#f6f9fd; --card:#fff; --border:#e3edf7; --text:#1f2937; --muted:#6b7280;
  --ink:#1c2f4f; --grow:#0d9488;
  --green:#10b981; --red:#ef4444; --amber:#f59e0b;
  --font-display:Georgia,"Songti SC","STZhongsong","华文中宋","SimSun",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font:13.5px/1.65 -apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;color:var(--text);background:var(--bg)}
button{font:inherit;cursor:pointer;border:none;background:none}
input,textarea,select{font:inherit;color:var(--text)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#c9d8ea;border-radius:4px}

/* ===== 顶栏 ===== */
header{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:18px;
  padding:0 20px;height:52px;background:rgba(255,255,255,.82);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;color:var(--primary-dark)}
.logo .name{font-family:var(--font-display);letter-spacing:1px}
.logo .badge{font-size:10px;font-weight:600;color:#9ca3af;border:1px solid var(--border);border-radius:8px;padding:1px 6px}
#key-dot{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
#key-dot .dot{width:8px;height:8px;border-radius:50%;background:#d1d5db}
#key-dot.ok .dot{background:var(--green)}
#key-dot.ok{color:var(--green)}
#account-user{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
#account-user .account-name{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#account-user button{padding:3px 8px;border:1px solid var(--border);border-radius:6px;color:var(--muted);font-size:11px;background:#fff}
#account-user button:hover{color:var(--primary-dark);border-color:#bfdbfe;background:var(--primary-light)}

main{max-width:1080px;margin:0 auto;padding:18px 20px 60px}
.page{display:none}
.page.active{display:block}

/* ===== 通用组件 ===== */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border-radius:8px;
  background:var(--primary);color:#fff;font-weight:500;transition:.15s}
.btn:hover{background:var(--primary-dark)}
.btn.ghost{background:var(--primary-light);color:var(--primary-dark)}
.btn.ghost:hover{background:#dbeafe}
.btn.danger{background:#fee2e2;color:#b91c1c}
.btn.danger:hover{background:#fecaca}
.btn.sm{padding:4px 10px;font-size:12.5px;border-radius:6px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.inp{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--card);outline:none;transition:.15s}
.inp:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,.12)}
textarea.inp{resize:vertical;min-height:90px}
label.fld{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 4px}
.empty{padding:36px 0;text-align:center;color:#9ca3af;font-size:13px}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;background:var(--primary-light);color:var(--primary-dark)}
.tag.gray{background:#f3f4f6;color:var(--muted)}
.tag.green{background:#d1fae5;color:#047857}
.tag.red{background:#fee2e2;color:#b91c1c}
.tag.amber{background:#fef3c7;color:#b45309}

/* ===== 键盘可达 & 动效克制 ===== */
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{
  outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

/* ===== 对话页 ===== */
.chat-wrap{display:flex;gap:14px;height:calc(100vh - 130px);min-height:480px}
.conv-side{width:225px;flex-shrink:0;display:flex;flex-direction:column;gap:8px}
.conv-side .newbtn{width:100%;justify-content:center}
#conv-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.conv-item{padding:9px 12px;border-radius:9px;border:1px solid transparent;cursor:pointer;transition:.15s}
.conv-item:hover{background:var(--primary-light)}
.conv-item.active{background:var(--primary-light);border-color:#bfdbfe}
.conv-item .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-item .d{font-size:11px;color:#9ca3af}
.conv-item .del{float:right;color:#d1d5db;font-size:12px}
.conv-item .del:hover{color:var(--red)}

.chat-main{flex:1;display:flex;flex-direction:column;background:var(--card);
  border:1px solid var(--border);border-radius:12px;overflow:hidden}
.chat-head{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border)}
.chat-head .title{font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chat-box{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:10px;max-width:88%}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.avatar{width:32px;height:32px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px}
.msg.assistant .avatar{background:var(--primary-light)}
.msg.user .avatar{background:#fde68a}
.bubble-wrap{display:flex;flex-direction:column;gap:6px;min-width:0}
.bubble{padding:10px 14px;border-radius:12px;background:var(--primary);color:#fff;white-space:pre-wrap;word-break:break-word}
.msg.assistant .bubble{background:#f8fafc;border:1px solid var(--border);color:var(--text);white-space:normal;overflow-wrap:break-word}
.bubble b{color:inherit}
.msg.assistant .bubble code{background:#eef2f7;border-radius:4px;padding:1px 5px;font-size:12.5px;color:#c026d3}
.bubble pre.md-code{background:#0f172a;color:#e2e8f0;border-radius:8px;padding:10px 12px;margin:6px 0;overflow-x:auto;font-size:12.5px;white-space:pre}
.bubble .md-h{font-weight:700;margin:4px 0 2px}
.bubble ul{margin:4px 0 4px 18px}
.bubble .err{color:var(--red)}
.fb{display:flex;gap:6px;align-items:center}
.fb button{font-size:13px;color:#9ca3af;padding:2px 6px;border-radius:6px}
.fb button:hover{background:#f3f4f6}
.fb button.on-up{color:var(--green)}
.fb button.on-down{color:var(--red)}
.fb .ts{font-size:11px;color:#c0c6cf;margin-left:4px}

.tool-blk{border:1px dashed #c7d7ec;border-radius:9px;background:#fbfdff;margin:2px 0;font-size:12.5px}
.tool-blk summary{padding:6px 10px;cursor:pointer;color:#4b6b95;user-select:none;list-style:none;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tool-blk summary::-webkit-details-marker{display:none}
.tool-blk summary::before{content:"▸";transition:.15s}
.tool-blk[open] summary::before{content:"▾"}
.tool-blk .tool-args{color:#94a3b8;font-family:Consolas,monospace;font-size:11.5px}
.tool-blk pre{margin:0 10px 10px;padding:8px 10px;background:#f1f5f9;border-radius:6px;
  white-space:pre-wrap;word-break:break-all;max-height:220px;overflow-y:auto;font-size:12px;color:#334155}
.tool-blk.bad{border-color:#fecaca;background:#fffafa}
.tool-blk.bad summary{color:#b91c1c}

.typing{display:inline-flex;gap:4px;padding:12px 14px}
.typing i{width:6px;height:6px;border-radius:50%;background:#a5b8d4;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}
.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

.chat-input{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--border);align-items:flex-end;position:relative}
#voice-btn{flex-shrink:0;width:40px;height:40px;border-radius:10px;background:var(--primary-light);color:var(--primary-dark);font-size:18px;display:flex;align-items:center;justify-content:center;transition:.15s}
#voice-btn:hover{background:#dbeafe}
#voice-btn.listening{background:var(--red);color:#fff;animation:voicePulse 1.2s ease-in-out infinite}
@keyframes voicePulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.45)}50%{box-shadow:0 0 0 9px rgba(239,68,68,0)}}
body.dark #voice-btn{background:#1e2a45;color:#9ec1f7}
body.dark #voice-btn.listening{background:#dc2626;color:#fff}
#msg-input{flex:1;max-height:130px;min-height:40px;padding:9px 13px;border:1px solid var(--border);
  border-radius:10px;outline:none;resize:none;font:inherit;line-height:1.5}
#msg-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,.12)}
#send-btn{padding:9px 22px}
.welcome{align-self:center;display:flex;gap:28px;align-items:stretch;padding:26px 10px;width:100%;max-width:760px}
.welcome .hello{flex:1.05;display:flex;flex-direction:column;justify-content:center}
.welcome h3{color:var(--ink);margin:0 0 6px;font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:.5px}
.welcome .hello .sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.welcome .examples{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
.welcome .ex{padding:6px 13px;border:1px solid var(--border);border-radius:18px;background:#fff;
  color:var(--primary-dark);font-size:12.5px;cursor:pointer;transition:.15s}
.welcome .ex:hover{border-color:var(--primary);background:var(--primary-light)}

/* 签名元素：本周课表速览卡 */
.sked{flex:1;background:linear-gradient(165deg,#ffffff 0%,var(--primary-light) 130%);
  border:1px solid var(--border);border-radius:14px;padding:14px 16px 12px;
  box-shadow:0 6px 22px rgba(31,58,138,.08);animation:skedIn .5s ease both}
@keyframes skedIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sked .sk-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.sked .sk-title{font-family:var(--font-display);font-size:15px;font-weight:700;color:var(--ink)}
.sked .sk-sub{font-size:11px;color:var(--muted)}
.sked .sk-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sked .sk-day{border:1px solid var(--border);border-radius:8px;background:rgba(255,255,255,.75);
  padding:6px 4px 7px;text-align:center;min-height:74px;transition:.15s}
.sked .sk-day:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(37,99,235,.12);border-color:#bfdbfe}
.sked .sk-day.today{border-color:var(--primary);background:var(--primary-light);box-shadow:inset 0 0 0 1px var(--primary)}
.sked .sk-day .d{font-size:11px;color:var(--muted);font-weight:600}
.sked .sk-day.today .d{color:var(--primary-dark)}
.sked .sk-day .c{display:block;font-size:10px;color:var(--ink);line-height:1.35;margin-top:4px;overflow:hidden}
.sked .sk-day .c b{font-weight:600}
.sked .sk-day .more{display:block;font-size:10px;color:var(--primary);margin-top:3px}
.sked .sk-day.empty .c{color:var(--muted)}
.welcome.fallback{display:block;text-align:center;padding:34px 20px;color:var(--muted)}
.welcome.fallback h3{color:var(--text);margin-bottom:6px;font-family:var(--font-display)}
.welcome.fallback .examples{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
body.dark .welcome h3{color:#dbe7f7}
body.dark .sked{background:linear-gradient(165deg,#141d31 0%,#1e2a45 130%)}
body.dark .sked .sk-day{background:rgba(11,18,32,.6)}
body.dark .sked .sk-day .c{color:#c7d4ea}
body.dark .sked .sk-title{color:#dbe7f7}
@media (max-width:720px){
  .welcome{flex-direction:column;gap:16px}
  .welcome .hello{align-items:center;text-align:center}
}

/* ===== 表格页 ===== */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;color:var(--muted);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid #f0f5fb;vertical-align:top}
.tbl tr:hover td{background:#fafcff}
.row2{display:flex;gap:14px;flex-wrap:wrap}
.row2>.card{flex:1;min-width:320px}
.muted{color:var(--muted);font-size:12px}
.snippet{background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin:8px 0;font-size:12.5px;white-space:pre-wrap;word-break:break-word;max-height:150px;overflow-y:auto}
.snippet .sc{float:right;color:var(--green);font-weight:600;font-size:12px}

/* ===== 学习中心 ===== */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:12px 14px}
.stat .v{font-size:22px;font-weight:700;color:var(--primary-dark)}
.stat .k{font-size:12px;color:var(--muted);margin-top:2px}
.stat.g .v{color:var(--green)} .stat.r .v{color:var(--red)} .stat.a .v{color:var(--amber)}
.learn-item{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:14px 16px;margin-bottom:10px}
.learn-item .q{font-weight:600;margin-bottom:6px}
.learn-item .a{color:#374151;white-space:pre-wrap}
.learn-item .ops{display:flex;gap:8px;margin-top:10px;align-items:center}
.filter-tabs{display:flex;gap:6px;margin:0 0 12px}
.filter-tabs button{padding:4px 14px;border-radius:16px;font-size:12.5px;color:var(--muted);background:#fff;border:1px solid var(--border)}
.filter-tabs button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.study-card{margin:14px 0}
.study-card h3{margin-bottom:6px}
.study-materials{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:230px;overflow:auto;margin:10px 0}
.study-material{display:flex;gap:8px;align-items:start;padding:9px 10px;border:1px solid var(--border);border-radius:9px;background:var(--card);font-size:13px;cursor:pointer}
.study-material:hover{border-color:var(--primary);background:var(--primary-light)}
.study-material small{display:block;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.study-controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
.study-controls input[type="number"]{width:90px;min-height:38px;margin:0}
.study-upload{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.study-result{margin-top:14px}
.study-point,.study-question{border-top:1px solid var(--border);padding:10px 0}
.study-point strong,.study-question strong{display:block;margin-bottom:4px}
.study-question details{margin-top:7px;color:var(--muted);font-size:13px}
@media(max-width:620px){.study-materials{grid-template-columns:minmax(0,1fr)}}

/* ===== 弹窗 & 提示 ===== */
.modal-wrap{position:fixed;inset:0;background:rgba(30,41,59,.25);backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center;z-index:100}
.modal-wrap.show{display:flex}
.modal{background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.7);
  border-radius:14px;padding:22px 24px;width:min(92vw,380px);box-shadow:0 18px 50px rgba(30,58,138,.18)}
.modal h4{margin-bottom:8px}
.modal p{color:var(--muted);margin-bottom:16px}
.modal .ops{display:flex;gap:10px;justify-content:flex-end}
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);
  background:rgba(17,24,39,.88);color:#fff;padding:9px 20px;border-radius:10px;font-size:13px;
  opacity:0;pointer-events:none;transition:.25s;z-index:200;max-width:80vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:rgba(190,18,60,.92)}

.status-line{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;margin-top:10px}
.status-line.ok{color:var(--green)} .status-line.bad{color:var(--red)}
details.help{margin-top:14px;border-top:1px dashed var(--border);padding-top:10px}
details.help summary{cursor:pointer;color:var(--primary-dark);font-size:13px}
details.help .body{margin-top:8px;color:var(--muted);font-size:12.5px}
@media (max-width:860px){
  .chat-wrap{flex-direction:column;height:auto}
  .conv-side{width:100%;max-height:150px}
  #chat-box{height:52vh}
}

/* ===== 新增：表格渲染 ===== */
.md-tbl{border-collapse:collapse;margin:6px 0;font-size:12.5px}
.md-tbl th,.md-tbl td{border:1px solid var(--border);padding:4px 10px;text-align:left}
.md-tbl th{background:var(--primary-light)}

/* ===== 新增：导航角标 / 主题按钮 / 停止按钮 ===== */
.nav-badge{position:absolute;top:-4px;right:2px;min-width:16px;height:16px;border-radius:8px;
  background:var(--red);color:#fff;font-size:10px;line-height:16px;text-align:center;padding:0 4px;font-weight:600}
#theme-btn{font-size:16px;padding:4px 8px;border-radius:8px}
#theme-btn:hover{background:var(--primary-light)}
#send-btn.stop{background:var(--red)}
#send-btn.stop:hover{background:#dc2626}

/* ===== 新增：只读文档弹窗 / 批量操作 ===== */
.modal.doc{width:min(92vw,680px);display:flex;flex-direction:column;max-height:82vh}
.modal.doc pre{flex:1;overflow:auto;background:#f8fafc;border:1px solid var(--border);border-radius:8px;
  padding:12px;white-space:pre-wrap;word-break:break-word;font:12.5px/1.7 Consolas,monospace;margin:0 0 14px}
.batch-ops{display:flex;gap:8px;margin-bottom:12px}

/* ===== 深色模式 ===== */
body.dark{--primary:#60a5fa;--primary-dark:#3b82f6;--primary-light:#1e2a45;--bg:#0b1220;--card:#141d31;
  --border:#2b3a55;--text:#e2e8f0;--muted:#8fa3c0}
body.dark header{background:rgba(11,18,32,.85)}
body.dark .msg.assistant .bubble{background:#101a2e;border-color:#2b3a55}
body.dark .msg.assistant .bubble code{background:#0b1220;color:#f0abfc}
body.dark .tool-blk{border-color:#33517e;background:#101a2e}
body.dark .tool-blk summary{color:#93b4e8}
body.dark .tool-blk pre{background:#0b1220;color:#c7d4ea}
body.dark .tool-blk.bad summary{color:#f87171}
body.dark .inp{background:#0b1220}
body.dark .welcome .ex{background:var(--card)}
body.dark .tag{background:#22345a;color:#9ec1f7}
body.dark .tag.gray{background:#223047;color:#8fa3c0}
body.dark .tag.green{background:#143529;color:#4ade80}
body.dark .tag.red{background:#3b1d24;color:#f87171}
body.dark .tag.amber{background:#3a2d12;color:#fbbf24}
body.dark .modal{background:rgba(20,29,49,.96);border-color:#2b3a55}
body.dark .modal.doc pre{background:#0b1220;border-color:#2b3a55}
body.dark .tbl td{border-bottom-color:#1d2a44}
body.dark .tbl tr:hover td{background:#101a2e}
body.dark .snippet{background:#0b1220}
body.dark .filter-tabs button{background:var(--card)}
body.dark .stat{background:var(--card)}
body.dark .learn-item{background:var(--card)}
body.dark .typing i{background:#5b7db1}

/* ===== 校园办事与可核对来源 ===== */
.services-view{font-size:16px;line-height:1.65}
.services-view h2{font-size:26px;color:var(--text);margin:2px 0 8px}
.services-intro{color:var(--muted);margin-bottom:20px;max-width:760px}
.service-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.services-view label{display:block;font-weight:600;margin-bottom:6px}
.services-view input{width:100%;min-height:44px;margin-bottom:14px}
.service-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.service-card{text-align:left;padding:16px;background:var(--card);border:1px solid var(--border);border-radius:12px;color:var(--text);min-height:140px;transition:background .15s,border-color .15s}
.service-card:hover,.service-card[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-light)}
.service-card strong{display:block;font-size:17px;margin:5px 0}
.service-card span{display:block;font-size:14px;color:var(--muted)}
.service-card .service-category{font-size:12px;color:var(--primary-dark);font-weight:600}
.services-view button:focus-visible,.services-view a:focus-visible,.source-refs a:focus-visible,.source-refs button:focus-visible{outline:3px solid var(--primary);outline-offset:3px}
.service-detail{min-height:240px;overflow-wrap:anywhere}

:root{
  --primary:#4d6bfe;
  --primary-dark:#3f56d8;

  --bg:#f7f8fa;
  --card:#ffffff;

}
html{background:var(--bg)}
body{

.logo .name{font-family:inherit;letter-spacing:0;font-weight:700}

.fb button{min-width:32px;min-height:30px}

.guide-card-icon{display:flex;align-items:center;justify-content:center;width:36px;height:36px;flex:0 0 36px;border-radius:12px;background:#4d6bfe;color:#fff;font-size:20px;box-shadow:0 5px 12px rgba(77,107,254,.2)}

.guide-card p{font-size:12.5px;line-height:1.65;color:#68738a}
.guide-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:9px;align-items:end}
.guide-grid label{font-size:12px;color:#6f7890;font-weight:600}
.guide-grid .inp{margin-top:5px;min-height:42px;background:#fff}
.guide-grid .btn{min-height:42px;white-space:nowrap}

.guide-example:hover{background:#fff;border-color:#9eb0ff;color:#3f56d8}
.guide-hint{margin-top:10px;font-size:11px;color:#778196}

<body>

<header>
  <div class="logo"><span class="logo-mark" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M12 3.5 3.5 8 12 12.5 20.5 8 12 3.5Z"/><path d="M6.5 10.2v5.3c3.5 2.2 7.5 2.2 11 0v-5.3M20.5 8v6.2"/></svg></span><span class="name">校园小助手</span> <span class="badge">Web Agent</span></div>
  <div class="header-context"><span class="header-context-dot"></span><span>Campus Copilot</span><span class="header-context-sep">/</span><span>为学生服务</span></div>
  <button id="theme-btn" type="button" title="切换深色模式" aria-label="切换深色模式" aria-pressed="false" onclick="toggleTheme()">🌙</button>
  <div id="key-dot" role="status" aria-live="polite"><span class="dot" aria-hidden="true"></span><span id="key-text">未配置</span></div>
  <div id="account-user" style="display:none"><span class="account-name" id="account-name"></span><button type="button" onclick="logoutAccount()">退出</button></div>
</header>

<main>
<!-- ============ 对话 ============ -->
<section id="page-chat" class="page active">
  <div class="chat-wrap">
    <div class="conv-side">
      <button class="btn newbtn" onclick="newConversation()">＋ 新建对话</button>
      <div id="conv-list"></div>
    </div>
    <div class="chat-main">
      <div class="chat-head">
        <div class="title" id="chat-title" title="双击可重命名">新对话</div>
        <button class="btn ghost sm" onclick="renameConversation()" title="修改对话标题">✏️ 改名</button>
        <button class="btn ghost sm" onclick="exportConversation()" title="导出为 Markdown 文件">💾 导出</button>
        <button class="btn ghost sm" onclick="clearChatView()">🔄 刷新</button>
      </div>
      <div id="chat-box" role="log" aria-live="polite" aria-label="对话消息"></div>
      <div class="chat-input">
        <button id="voice-btn" type="button" title="语音输入" aria-label="语音输入" onclick="toggleVoice()" style="display:none">🎤</button>
        <textarea id="msg-input" rows="1" aria-label="输入消息" placeholder="输入问题，Enter 发送，Shift+Enter 换行"></textarea>
        <button class="btn" id="send-btn" type="button" onclick="sendMessage()">发送</button>
      </div>
    </div>
  </div>
</section>

<!-- ============ 办事导航 ============ -->
<template id="chat-panel-services">
<div class="panel-content services-view">
  <h2 id="services-heading">生活区 · 校园服务</h2>
  <p class="services-intro">办事导航、部门联系人、学院信息、校内外地点和吃饭推荐都集中在这里。你也可以直接在对话中描述想解决的生活问题。</p>
  <section class="guide-card" aria-labelledby="guide-heading">
    <div class="guide-card-head">
      <span class="guide-card-icon" aria-hidden="true">⌖</span>
      <div>
        <h3 id="guide-heading">智能地图导览</h3>
        <p>告诉我起点和目的地，我会结合当前学校与高德地点数据生成导览，并提供地图位置和导航入口。</p>
      </div>
    </div>
    <div class="guide-grid">
      <label for="guide-from">从哪里出发
        <input class="inp" id="guide-from" value="学校" placeholder="如：南门、一食堂">
      </label>
      <label for="guide-to">想去哪里
        <input class="inp" id="guide-to" placeholder="如：图书馆、校外餐馆">
      </label>
      <button class="btn" type="button" onclick="startCampusGuide()">生成导览</button>
    </div>
    <div class="guide-examples" aria-label="导览示例">
      <button class="guide-example" type="button" onclick="guideExample('从南门到图书馆怎么走？')">南门 → 图书馆</button>
      <button class="guide-example" type="button" onclick="guideExample('校内最近的一食堂在哪里？')">找最近食堂</button>
      <button class="guide-example" type="button" onclick="guideExample('学校附近评分高的餐馆有哪些？')">附近高分餐馆</button>
    </div>
    <p class="guide-hint">提示：地图评分来自高德返回值，不等同于完整用户评论；路线请以高德实时导航为准。</p>
  </section>
  <div class="service-layout">
    <div>
      <label for="service-filter">查找办事事项</label>
      <input class="inp" id="service-filter" type="search" placeholder="例如：请假、奖助、补卡" oninput="filterServices()">
      <div id="service-grid" class="service-grid" aria-live="polite"></div>
    </div>
    <div id="service-detail" class="card service-detail" aria-live="polite"><p>选择左侧事项查看相关资料。</p></div>
  </div>
  <div class="card colleges-panel">
    <h3>按学院查看信息</h3>
    <p class="service-gap">点击学院，查看当前学校知识库中已核实的资料和联系人。未收录的内容会明确标注。</p>
    <div id="college-grid" class="college-grid" aria-live="polite"></div>
    <div id="college-detail" class="college-detail" aria-live="polite"><p>选择学院查看详情。</p></div>
  </div>
  <div class="card contacts-panel">
    <h3>找部门与联系人</h3>
    <form onsubmit="event.preventDefault(); searchContacts()">
      <label for="contact-query">部门、学院或岗位名称</label>
      <div class="contact-search"><input class="inp" id="contact-query" type="search" placeholder="例如：应用科技学院、学籍科" required><button id="contact-search-btn" class="btn" type="submit">查找</button></div>
    </form>
    <p class="service-gap">联系方式取自官网办公电话簿原文；号码和办公地址可能调整，请核对来源。</p>
    <div id="contact-results" class="contacts-grid" aria-live="polite"></div>
  </div>

</div>
</template>

<!-- ============ 知识库 ============ -->
<template id="chat-panel-knowledge">
<div class="panel-content ">
  <div class="row2">
    <div class="card">
      <h3>📄 添加知识</h3>
      <label class="fld" for="kn-title">标题</label>
      <input class="inp" id="kn-title" placeholder="如：实验室安全管理规定">
      <label class="fld" for="kn-content">内容（纯文本 / Markdown）</label>
      <textarea class="inp" id="kn-content" placeholder="粘贴文档内容…"></textarea>
      <div style="display:flex;gap:10px;margin-top:12px;align-items:center">
        <button class="btn" onclick="addKnowledge()">入库</button>
        <label class="btn ghost" style="cursor:pointer">📂 上传 txt / md 文件
          <input type="file" id="kn-file" accept=".txt,.md,.markdown" style="display:none" onchange="uploadKnowledge(this)">
        </label>
      </div>
    </div>
    <div class="card">
      <h3>🔍 检索测试</h3>
      <label class="fld" for="kn-search">输入问题，测试 RAG 检索效果</label>
      <div style="display:flex;gap:8px">
        <input class="inp" id="kn-search" placeholder="如：补考没过怎么办？" onkeydown="if(event.key==='Enter')searchKnowledge()">
        <button class="btn ghost" onclick="searchKnowledge()">检索</button>
      </div>
      <div id="kn-search-result"></div>
    </div>
  </div>
  <div class="card" style="margin-top:14px">
    <h3>📚 知识文档（<span id="kn-count">0</span>）</h3>
    <div style="overflow-x:auto">
      <input class="inp" id="kn-filter" type="search" placeholder="筛选文档标题或来源" aria-label="筛选知识文档" oninput="renderKnowledgePage(0)">
      <div id="kn-pagination" class="panel-pagination"></div>
      <table class="tbl" id="kn-table">
        <thead><tr><th>标题</th><th>类型</th><th>来源</th><th>字数</th><th>命中</th><th>添加时间</th><th>操作</th></tr></thead>
        <tbody id="kn-tbody"></tbody>
      </table>
    </div>
    <div id="kn-empty" class="empty" style="display:none">知识库为空，先添加文档吧</div>
  </div>

</div>
</template>

<!-- ============ 记忆 ============ -->
<template id="chat-panel-memory">
<div class="panel-content ">
  <div class="row2">
    <div class="card">
      <h3>➕ 添加记忆</h3>
      <label class="fld" for="mem-content">内容</label>
      <input class="inp" id="mem-content" placeholder="如：该学生是计算机专业大三学生">
      <label class="fld" for="mem-category">分类</label>
      <select class="inp" id="mem-category">
        <option>通用</option><option>学生背景</option><option>重要事项</option><option>偏好</option>
      </select>
      <button class="btn" style="margin-top:12px" onclick="addMemory()">保存</button>
      <button class="btn ghost" style="margin-top:12px;margin-left:8px" onclick="consolidateMemory()" title="合并高度相似的记忆，保留较新一条">🧹 整理记忆</button>
      <details class="help">
        <summary>记忆机制说明</summary>
        <div class="body">对话中助手可主动保存重要信息；发送“学习这段对话”，在卡片中确认提炼，可从对话整理记忆；每次提问时按相关性自动召回最相关的记忆注入上下文。</div>
      </details>
    </div>
    <div class="card">
      <h3>🔍 记忆召回测试</h3>
      <label class="fld" for="mem-search">输入关键词，看会召回哪些记忆</label>
      <div style="display:flex;gap:8px">
        <input class="inp" id="mem-search" placeholder="如：考试" onkeydown="if(event.key==='Enter')searchMemory()">
        <button class="btn ghost" onclick="searchMemory()">召回</button>
      </div>
      <div id="mem-search-result"></div>
    </div>
  </div>
  <div class="card" style="margin-top:14px">
    <h3>🧠 长期记忆（<span id="mem-count">0</span>）</h3>
    <table class="tbl">
      <thead><tr><th>内容</th><th>分类</th><th>来源</th><th>时间</th><th>操作</th></tr></thead>
      <tbody id="mem-tbody"></tbody>
    </table>
    <div id="mem-empty" class="empty" style="display:none">暂无记忆，先去对话中让助手认识你吧</div>
  </div>

</div>
</template>

<!-- ============ 学习中心 ============ -->

<script>
/* ================= 基础工具 ================= */
const $ = s => document.querySelector(s);
const state = { convId: null, learnTab: 'pending', sending: false, controller: null, learnedAt: 0 };
let currentUser = null;
const knMap = {};  // 知识库 id -> title
const TOOL_LABELS = {
  query_course_schedule: '课表查询', query_grades: '成绩查询', calculator: '计算器',
  get_current_time: '当前时间', query_academic_calendar: '校历查询',
  search_knowledge: '知识库检索', search_campus_notice: '通知检索',
  save_memory: '保存记忆', search_memory: '记忆召回',
  find_campus_contact: '官网联系人查询', get_campus_service: '办事导航查询',
  recommend_campus_food: '随机吃饭推荐',
  search_campus_places: '高德地点搜索', get_campus_place_detail: '高德地点详情'
};

async function api(path, opts = {}) {
  const resp = await fetch(path, { headers: { 'Content-Type': 'application/json', 'X-Access-Token': getToken() }, ...opts });
  let data = null;
  try { data = await resp.json(); } catch (e) { data = null; }
  if (resp.status === 401) {
    if (data && data.code === 'AUTH_REQUIRED') showAccountGate('login');
    else showTokenGate();
    throw new Error((data && data.error) || '需要认证');
  }
  if (!resp.ok) throw new Error((data && data.error) || `请求失败 ${resp.status}`);
  return data;
}

/* ================= 访问口令 ================= */
function getToken() { return localStorage.getItem('campus_token') || ''; }
let tokenPending = false;
function showTokenGate() {
  if (tokenPending) return;
  tokenPending = true;
  $('#token-err').style.display = 'none';
  $('#token-input').value = '';
  $('#token-mask').classList.add('show');
  setTimeout(() => $('#token-input').focus(), 60);
}
async function submitToken() {
  const val = $('#token-input').value.trim();
  if (!val) return;
  try {
    const resp = await fetch('/api/public/auth', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: val })
    });
    const data = await resp.json();
    if (data && data.ok) {
      localStorage.setItem('campus_token', val);
      location.reload();
    } else {
      $('#token-err').style.display = 'block';
      $('#token-input').select();
    }
  } catch (e) {
    $('#token-err').textContent = '验证失败：' + e.message;
    $('#token-err').style.display = 'block';
  }
}
$('#token-ok').addEventListener('click', submitToken);
$('#token-input').addEventListener('keydown', e => { if (e.key === 'Enter') submitToken(); });
let accountMode = 'login';
let accountPending = false;
function showAccountGate(mode = 'login') {
  if (accountPending) return;
  accountMode = mode;
  $('#account-title').textContent = mode === 'setup' ? '创建管理员账号' : '登录校园小助手';
  $('#account-desc').textContent = mode === 'setup' ? '首次使用请创建管理员账号，账号信息只保存在本机服务端。' : '请输入账号密码继续使用校园助手。';
  $('#account-submit').textContent = mode === 'setup' ? '创建并登录' : '登录';
  $('#account-password').setAttribute('autocomplete', mode === 'setup' ? 'new-password' : 'current-password');
  $('#account-err').style.display = 'none';
  $('#account-mask').classList.add('show');
  setTimeout(() => $('#account-username').focus(), 60);
}
async function submitAccount() {
  if (accountPending) return;
  const username = $('#account-username').value.trim();
  const password = $('#account-password').value;
  if (!username || !password) return;
  accountPending = true; $('#account-submit').disabled = true;
  try {
    const endpoint = accountMode === 'setup' ? '/api/public/register' : '/api/public/login';
    const resp = await fetch(endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({username, password}) });
    const data = await resp.json();
    if (!resp.ok || !data.ok) throw new Error(data.error || '登录失败');
    location.reload();
  } catch (e) {
    $('#account-err').textContent = e.message;
    $('#account-err').style.display = 'block';
  } finally {
    accountPending = false; $('#account-submit').disabled = false;
  }
}
async function logoutAccount() {
  try { await fetch('/api/auth/logout', {method:'POST', headers:{'Content-Type':'application/json','X-Access-Token':getToken()}}); } catch (e) { }
  location.reload();
}
$('#account-submit').addEventListener('click', submitAccount);
$('#account-password').addEventListener('keydown', e => { if (e.key === 'Enter') submitAccount(); });
(async function checkTokenGate() {
  try {
    const resp = await fetch('/api/public/auth');
    const data = await resp.json();
    // 首次部署必须先创建账号；即使同时配置了访问口令，也不能遮挡注册入口。
    if (data && data.account_setup_required) { showAccountGate('setup'); return; }
    let accountOK = false;
    if (data && data.account_required) {
      const me = await fetch('/api/auth/me', {headers: {'X-Access-Token': getToken()}}).catch(() => null);
      const current = me ? await me.json().catch(() => null) : null;
      accountOK = !!(current && current.authenticated && current.user && current.user.id);
      if (accountOK) {
        currentUser = current.user;
        $('#account-user').style.display = 'flex';
        $('#account-name').textContent = current.user.username;
      } else { showAccountGate('login'); return; }
    }
    if (data && data.required && !getToken() && !accountOK) showTokenGate();
  } catch (e) { /* 探测失败不阻塞页面 */ }
})();
function esc(s) { return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function safeSourceUrl(value) {
  try {
    const parsed = new URL(String(value || ''));
    return ['http:', 'https:'].includes(parsed.protocol) && !parsed.username && !parsed.password ? parsed.href : '';
  } catch (e) { return ''; }
}
function sourceRefsHtml(refs) {
  if (!Array.isArray(refs) || !refs.length) return '';
  const rows = refs.slice(0, 8).map(ref => {
    const url = safeSourceUrl(ref.source_url);
    const docId = Number(ref.doc_id);
    const title = esc(ref.title || '未命名资料');
    const link = url ? `<a href="${esc(url).replace(/"/g, '&quot;')}" target="_blank" rel="noopener noreferrer">${title} ↗</a>` : title;
    const local = Number.isSafeInteger(docId) && docId > 0 ? `<button type="button" onclick="viewKnowledge(${docId})">查看已收录原文</button>` : '';
    return `<div class="source-ref">${link}<div class="source-ref-meta">${esc(ref.source_kind || '待核对来源')} · 入库：${esc(ref.indexed_at || '未知')}<br>发布时间：${esc(ref.published_at || '未标注，请核对原文')}</div>${local}</div>`;
  }).join('');
  return `<details class="source-refs"><summary>检索参考资料（${refs.length}）</summary><p class="source-ref-meta">以下为检索命中资料，请结合原文核对结论；入库时间不是发布时间。</p>${rows}</details>`;
}

function toast(msg, isErr = false) {
  const t = $('#toast');
  t.textContent = msg; t.className = isErr ? 'show err' : 'show';
  clearTimeout(t._tm); t._tm = setTimeout(() => t.className = '', 2600);
}
let modalCb = null;
function confirmModal(title, text, cb) {
  $('#modal-title').textContent = title; $('#modal-text').textContent = text;
  modalCb = cb; $('#modal-mask').classList.add('show');
}
function hideModal() { $('#modal-mask').classList.remove('show'); modalCb = null; }
$('#modal-ok').onclick = () => { if (modalCb) modalCb(); hideModal(); };

$('#modal-mask').onclick = e => { if (e.target.id === 'modal-mask') hideModal(); };

/* ================= Markdown 轻量渲染（支持表格） ================= */
function renderTableRows(rows) {
  const cells = r => r.replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
  let html = '<table class="md-tbl">';
  let body = rows.slice();
  if (rows.length >= 2 && /^[\s|:-]+$/.test(rows[1]) && rows[1].includes('-')) {
    html += '<tr>' + cells(rows[0]).map(c => `<th>${c}</th>`).join('') + '</tr>';
    body = rows.slice(2);
  }
  html += body.map(r => '<tr>' + cells(r).map(c => `<td>${c}</td>`).join('') + '</tr>').join('');
  return html + '</table>';
}
function md(text) {
  let s = esc(text || '');
  const codeBlocks = [];
  s = s.replace(/```([\s\S]*?)```/g, (m, c) => { codeBlocks.push(c.trim()); return `\x00CB${codeBlocks.length - 1}\x00`; });
  s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
  const lines = s.split('\n'); const out = []; let inUl = false; let tbl = [];
  const flushUl = () => { if (inUl) { out.push('</ul>'); inUl = false; } };
  const flushTbl = () => { if (tbl.length) { out.push(renderTableRows(tbl)); tbl = []; } };
  for (let line of lines) {
    const t = line.trim();
    if (t.startsWith('|') && t.endsWith('|') && t.length > 2) { flushUl(); tbl.push(t); continue; }
    flushTbl();
    if (/^#{1,4}\s+/.test(t)) { flushUl(); out.push(`<div class="md-h">${t.replace(/^#{1,4}\s+/, '')}</div>`); }
    else if (/^[-*•]\s+/.test(t)) { if (!inUl) { out.push('<ul>'); inUl = true; } out.push('<li>' + t.replace(/^[-*•]\s+/, '') + '</li>'); }
    else if (/^\d+[.、)]\s+/.test(t)) { if (!inUl) { out.push('<ul>'); inUl = true; } out.push('<li>' + t.replace(/^\d+[.、)]\s+/, '') + '</li>'); }
    else { flushUl(); if (t === '') out.push('<div style="height:6px"></div>'); else out.push('<div>' + t + '</div>'); }
  }
  flushUl(); flushTbl();
  s = out.join('');
  s = s.replace(/\x00CB(\d+)\x00/g, (m, i) => `<pre class="md-code">${codeBlocks[i]}</pre>`);
  return s;
}

/* ================= 对话内操作卡片 ================= */
const PANEL_TITLES = {services:'生活区',knowledge:'知识库',memory:'长期记忆',learning:'学习区',settings:'设置'};
function mountChatPanels(message, toolEvents, eager = false) {
  const seen = new Set();
  for (const ev of toolEvents || []) {
    const panel = ev.name === 'open_chat_panel' && ev.ok !== false && ev.result?.ui_panel;
    if (!Object.hasOwn(PANEL_TITLES, panel) || seen.has(panel)) continue;
    seen.add(panel); message.classList.add('has-panel');
    const card = document.createElement('div'); card.className = 'chat-panel'; card.dataset.panel = panel;
    if (ev.result.focus === 'maps') card.dataset.focus = 'maps';
    else if (ev.result.focus === 'school') card.dataset.focus = 'school';
    const head = document.createElement('div'); head.className = 'chat-panel-head';
    const title = document.createElement('strong'); title.textContent = PANEL_TITLES[panel];
    const button = document.createElement('button'); button.type = 'button'; button.className = 'btn ghost sm';
    button.textContent = '打开操作卡片'; button.setAttribute('aria-expanded','false');
    const body = document.createElement('div'); body.className = 'chat-panel-body'; body.hidden = true;
    head.append(title,button); card.append(head,body); message.querySelector('.bubble-wrap').appendChild(card);
    button.onclick = () => body.hidden ? openChatPanel(card) : collapseChatPanel(card);
    if (eager) openChatPanel(card);
  }
}
function collapseChatPanel(card) {
  // Removing form nodes also discards any unsaved password, rather than keeping it in hidden history.
  card.querySelector('.chat-panel-body').replaceChildren();
  card.querySelector('.chat-panel-body').hidden = true;
  const button = card.querySelector('.chat-panel-head button');
  button.textContent = '打开操作卡片'; button.setAttribute('aria-expanded','false');
}
async function openChatPanel(card) {
  const panel = card.dataset.panel;
  document.querySelectorAll('.chat-panel').forEach(other => {
    if (other !== card && other.dataset.panel === panel) collapseChatPanel(other);
  });
  const body = card.querySelector('.chat-panel-body');
  body.replaceChildren($('#chat-panel-' + panel).content.cloneNode(true)); body.hidden = false;
  const button = card.querySelector('.chat-panel-head button'); button.textContent = '收起'; button.setAttribute('aria-expanded','true');
  card.setAttribute('aria-busy','true');
  try {
    if (panel === 'services') { await loadServices(); await loadColleges(); }
    if (panel === 'knowledge') await loadKnowledge();
    if (panel === 'memory') await loadMemories();
    if (panel === 'learning') { await loadStudyMaterials(); await loadLearnStats(); if (card.isConnected && !body.hidden) await switchLearnTab('pending'); }
    if (panel === 'settings') await loadSchools();
  } catch (e) {
    if (card.isConnected && !body.hidden) {
      const error = document.createElement('p'); error.className = 'err'; error.setAttribute('role','alert'); error.textContent = '加载失败：' + e.message;
      const retry = document.createElement('button'); retry.className = 'btn ghost sm'; retry.textContent = '重新加载'; retry.onclick = () => openChatPanel(card);
      body.prepend(error,retry);
    }
  } finally {
    card.setAttribute('aria-busy','false');
    if (card.isConnected && !body.hidden) {
      const chat = $('#chat-box');
      chat.scrollTop += card.getBoundingClientRect().top - chat.getBoundingClientRect().top - 12;
      if (card.dataset.focus === 'maps' && body.querySelector('#map-settings')) {
        body.scrollTop += body.querySelector('#map-settings').getBoundingClientRect().top - body.getBoundingClientRect().top - 10;
      }
      if (card.dataset.focus === 'school' && body.querySelector('#school-picker')) {
        const picker = body.querySelector('#school-picker');
        body.scrollTop += picker.getBoundingClientRect().top - body.getBoundingClientRect().top - 10;
        picker.focus();
      }
    }
  }
}

/* ================= 对话中的高德地点卡片 ================= */
function safeAmapUrl(value) {
  try {
    const u = new URL(String(value || ''));
    return u.protocol === 'https:' && u.hostname === 'uri.amap.com' && !u.username && !u.password &&
      ['/marker','/poidetail','/navigation'].includes(u.pathname) && !u.searchParams.has('key') ? u.href : '';
  } catch (e) { return ''; }
}
function placeResultsHtml(result) {
  const notice = '<p class="map-notice">' + esc(result.notice || '高德地图未提供用户评论正文。') + '</p>';
  const time = result.fetched_at ? '<p class="map-notice">来源：高德地图 · 查询于 ' + esc(result.fetched_at) + '</p>' : '';
  const origin = result.origin && result.origin.name ? '<div class="route-summary"><span class="route-summary-icon" aria-hidden="true">⌖</span><span>导览起点：<strong>' + esc(result.origin.name) + '</strong></span>' + (result.origin.fallback ? '<span class="tag amber">已回退学校中心点</span>' : '<span class="tag green">已确认</span>') + '</div>' : '';
  const originNote = result.origin_note ? '<p class="map-notice map-warning">' + esc(result.origin_note) + '</p>' : '';
  if (!result.available) return '<div class="place-card"><p>' + esc(result.message || '暂时无法查询地图。') + '</p></div>' + notice;
  const rows = (result.results || []).map(row => {
    const facts = [
      row.rating != null ? '高德评分 ' + esc(row.rating) : '评分未提供',
      row.cost != null ? '人均参考 ¥' + esc(row.cost) : '人均未提供',
      row.distance_m != null && Number.isFinite(Number(row.distance_m)) ? '距学校中心直线 ' + esc(row.distance_m) + ' 米' : ''
    ].filter(Boolean).map(text=>'<span>'+text+'</span>').join('');
    const links = [['map_url','地图位置'],['navigation_url','从学校导航'],['source_url','在高德核对详情']].map(([field,label])=>{
      const url = safeAmapUrl(row[field]);
      return url ? '<a class="btn ghost" href="'+esc(url).replace(/"/g,'&quot;')+'" target="_blank" rel="noopener noreferrer">'+label+'</a>' : '';
    }).join('');
    const button = /^[A-Za-z0-9]{1,40}$/.test(String(row.id || '')) ? '<button type="button" class="btn ghost" data-poi-id="'+row.id+'">更新地点详情</button>' : '';
    return '<article class="place-card"><h4>'+esc(row.name || '未命名地点')+'</h4><p>'+esc([row.city,row.district,row.address].filter(Boolean).join(' · ') || '地址未提供')+'</p><div class="place-facts">'+facts+'</div>' +
      (row.category ? '<p class="muted">'+esc(row.category)+'</p>' : '') +
      (row.phone ? '<p>电话：'+esc(row.phone)+'</p>' : '') +
      (row.opening_hours ? '<p>营业时间（地图记录）：'+esc(row.opening_hours)+'</p>' : '') +
      '<div class="place-actions">'+links+button+'</div></article>';
  }).join('');
  return origin + originNote + (rows || '<p class="muted">'+esc(result.message || '本次没有匹配地点。')+'</p>') + notice + time;
}
function mountPlaceResults(message, toolEvents) {
  for (const ev of toolEvents || []) {
    if (!['search_campus_places','get_campus_place_detail'].includes(ev.name) || ev.ok === false || !ev.result) continue;
    const container = document.createElement('div'); container.className = 'place-results';
    container.innerHTML = placeResultsHtml(ev.result);
    container.querySelectorAll('[data-poi-id]').forEach(button=>button.onclick=()=>{
      const row = (ev.result.results || []).find(row=>row.id === button.dataset.poiId);
      if (row) requestMapMessage('查看“'+row.name+'”的地点详情',row.id);
    });
    message.querySelector('.bubble-wrap').appendChild(container);
  }

function toolBlockHtml(ev, pending) {
  if (ev.name === 'open_chat_panel') return '';
  if (['search_campus_places','get_campus_place_detail'].includes(ev.name) && !pending && ev.ok !== false) return '';
  const label = TOOL_LABELS[ev.name] || ev.name;
  const argStr = JSON.stringify(ev.args || {});
  const a = argStr.length > 70 ? argStr.slice(0, 70) + '…' : argStr;
  if (pending) return `<div class="tool-blk"><summary>🛠 ${esc(label)} <span class="tool-args">${esc(a)}</span> <span style="color:#94a3b8">执行中…</span></summary></div>`;
  let r; try { r = typeof ev.result === 'string' ? ev.result : JSON.stringify(ev.result, null, 2); } catch (e) { r = String(ev.result); }
  if (r && r.length > 900) r = r.slice(0, 900) + '…';
  return `<details class="tool-blk${ev.ok === false ? ' bad' : ''}"><summary>${ev.ok === false ? '⚠️' : '🛠'} ${esc(label)} <span class="tool-args">${esc(a)}</span></summary><pre>${esc(r)}</pre></details>`;
}

async function sendMessage(options = {}) {
  const input = $('#msg-input');
  const text = input.value.trim();
  const sendBtn = $('#send-btn');
  const chatBox = $('#chat-box');

  // 发送中点击 = 停止生成
  if (state.sending) {
    if (state.controller) state.controller.abort();
    return;
  }
  if (!text) return;
  if (!state.convId) { const r = await api('/api/conversations', { method: 'POST' }); state.convId = r.id; }
  input.value = ''; input.style.height = 'auto';
  state.sending = true; state.controller = new AbortController();
  chatBox.setAttribute('aria-busy', 'true');
  sendBtn.disabled = false; sendBtn.classList.add('stop'); sendBtn.textContent = '停止'; sendBtn.setAttribute('aria-label', '停止生成');

  $('#welcome-box')?.remove();
  renderMessage('user', text, [], null, 0);
  const shell = document.createElement('div');
  shell.className = 'msg assistant';
  shell.innerHTML = `<div class="avatar">AI</div>
    <div class="bubble-wrap">
      <div class="tools" id="live-tools"></div>
      <div class="bubble typing"><i></i><i></i><i></i></div>
    </div>`;
  $('#chat-box').appendChild(shell);
  $('#chat-box').scrollTop = $('#chat-box').scrollHeight;

  const events = [];
  let openedPanel = false;
  let rawText = '';
  const toolsEl = shell.querySelector('.tools');
  const bubbleEl = shell.querySelector('.bubble');

  const setTyping = () => {
    bubbleEl.className = 'bubble typing';
    bubbleEl.innerHTML = '<i></i><i></i><i></i>';
    rawText = '';
  };

  const handle = ev => {
    if (ev.type === 'conversation') { state.convId = ev.data; return; }
    if (ev.type === 'status') { return; }
    if (ev.type === 'delta') {
      if (bubbleEl.classList.contains('typing')) {
        bubbleEl.className = 'bubble';
        bubbleEl.textContent = '';
      }
      rawText += ev.data;
      bubbleEl.textContent = rawText;
      chatBox.scrollTop = chatBox.scrollHeight;
      return;
    }
    if (ev.type === 'tool_call') {
      events.push({ name: ev.data.name, args: ev.data.args, pending: true });
      toolsEl.innerHTML = events.map(e => toolBlockHtml(e, e.pending)).join('');
      chatBox.scrollTop = chatBox.scrollHeight;
      return;
    }
    if (ev.type === 'tool_result') {
      const i = events.findIndex(e => e.pending && e.name === ev.data.name);
      if (i >= 0) { events[i] = { name: ev.data.name, args: events[i].args, result: ev.data.result, ok: ev.data.ok }; }
      toolsEl.innerHTML = events.map(e => toolBlockHtml(e)).join('');
      // 工具执行完进入下一轮思考，恢复打字动画
      setTyping();
      return;
    }
    if (ev.type === 'answer') {
      openedPanel = (ev.data.tool_events || events).some(e => e.name === 'open_chat_panel' && e.ok !== false);
      bubbleEl.className = 'bubble';
      bubbleEl.innerHTML = md(ev.data.content);
      const fw = document.createElement('div');
      fw.className = 'fb';
      fw.innerHTML = `<button title="复制回答" onclick="copyAnswer(this)">📋</button>
                      <button onclick="sendFeedback(${ev.data.message_id},'up',this)">👍</button>
                      <button onclick="sendFeedback(${ev.data.message_id},'down',this)">👎</button>`;
      const wrap = shell.querySelector('.bubble-wrap');
      wrap.insertAdjacentHTML('beforeend', sourceRefsHtml(ev.data.source_refs || []));
      wrap.appendChild(fw);
      mountChatPanels(shell, ev.data.tool_events || events, true);
      mountPlaceResults(shell, ev.data.tool_events || events);
      chatBox.scrollTop = chatBox.scrollHeight;
      return;
    }
    if (ev.type === 'error') {
      bubbleEl.className = 'bubble';
      bubbleEl.innerHTML = `<span class="err">${esc(ev.data)}</span>`;
      toast(ev.data, true);
    }
  };

  let aborted = false;
  try {
    const resp = await fetch('/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Access-Token': getToken() },
      body: JSON.stringify({ conversation_id: state.convId, message: text, ...(options.place_id ? {place_id:options.place_id} : {}) }),
      signal: state.controller.signal,
    });
    if (!resp.ok) {
      const errText = await resp.text().catch(() => '');
      if (resp.status === 401) showTokenGate();
      throw new Error(resp.status === 401 ? '需要访问口令' : `请求失败 ${resp.status} ${errText.slice(0, 80)}`);
    }
    const reader = resp.body.getReader();
    const dec = new TextDecoder(); let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const chunk = buf.slice(0, i).trim(); buf = buf.slice(i + 2);
        if (!chunk.startsWith('data:')) continue;
        try { handle(JSON.parse(chunk.slice(5).trim())); } catch (e) { }
      }
    }
  } catch (e) {
    aborted = true;
    if (e.name === 'AbortError') {
      if (bubbleEl.classList.contains('typing') && !rawText) {
        bubbleEl.className = 'bubble';
        bubbleEl.innerHTML = '<span class="err">已停止生成</span>';
      } else {
        bubbleEl.className = 'bubble';
        bubbleEl.innerHTML = '<span class="err">⏹ 已停止生成（以上为部分内容）</span>';
      }
      toast('已停止生成');
    } else {
      bubbleEl.className = 'bubble';
      bubbleEl.innerHTML = `<span class="err">连接失败：${esc(e.message)}</span>`;
    }
  } finally {
    state.sending = false; state.controller = null;
    chatBox.removeAttribute('aria-busy');
    sendBtn.classList.remove('stop'); sendBtn.textContent = '发送'; sendBtn.setAttribute('aria-label', '发送消息');
    input.focus();
    const list = await loadConversations();
    if (list) { const c = list.find(x => x.id === state.convId); if (c) $('#chat-title').textContent = c.title; }
    if (aborted && state.convId) openConversation(state.convId);  // 刷新已存库的部分
    else if (!openedPanel) autoLearnMaybe();
  }
}

async function exportConversation() {
  if (!state.convId) { toast('当前没有对话', true); return; }
  try {
    const msgs = await api(`/api/conversations/${state.convId}/messages`);
    if (!msgs.length) { toast('当前对话为空', true); return; }
    const title = $('#chat-title').textContent || '对话导出';
    const parts = msgs.map(m => {
      const who = m.role === 'user' ? '🙋 学生' : '🎓 助手';
      const tools = (m.tool_events || []).map(e => `> 🛠 ${TOOL_LABELS[e.name] || e.name}`).join('\n');
      return `## ${who}\n\n${tools ? tools + '\n\n' : ''}${m.content}`;
    });
    const blob = new Blob([`# ${title}\n\n` + parts.join('\n\n---\n\n')], { type: 'text/markdown;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (title.replace(/[\\/:*?"<>|]/g, '') || '对话导出') + '.md';
    a.click();
    URL.revokeObjectURL(a.href);
    toast('已导出为 Markdown 文件');
  } catch (e) { toast(e.message, true); }
}

async function autoLearnMaybe() {

    const msgs = await api(`/api/conversations/${state.convId}/messages`);

function readStudyFile(input) {
  const file = input?.files?.[0];
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) { toast('单个学习资料不能超过 2 MB', true); input.value = ''; return; }
  const reader = new FileReader();
  reader.onload = () => {
    studyUploadText = String(reader.result || '');
    $('#study-file-name').textContent = `${file.name}（${studyUploadText.length} 字）`;
    if (!$('#study-upload-title').value.trim()) $('#study-upload-title').value = file.name.replace(/\.[^.]+$/, '');
  };
  reader.onerror = () => { studyUploadText = ''; toast('读取文件失败', true); };
  reader.readAsText(file, 'utf-8');
}
function selectedStudyIds() {
  return Array.from(document.querySelectorAll('#study-materials [data-study-id]:checked')).map(input => Number(input.dataset.studyId)).filter(Number.isInteger);
}
function studyResultHtml(result) {
  const points = (result.key_points || []).map(item => `<div class="study-point"><strong>📌 ${esc(item.point)}</strong><span>${esc(item.explanation)}</span><small class="muted">来源：${esc(item.source || '未标注')}</small></div>`).join('');
  const questions = (result.questions || []).map((item, index) => `<div class="study-question"><strong>${index + 1}. ${esc(item.question)}</strong>${item.options?.length ? `<ol>${item.options.map(option => `<li>${esc(option)}</li>`).join('')}</ol>` : ''}<details><summary>查看答案与解析</summary><p><b>答案：</b>${esc(item.answer)}</p><p>${esc(item.explanation)}</p><small>来源：${esc(item.source || '未标注')}</small></details></div>`).join('');
  return `<div class="service-note">${esc(result.overview || '已完成资料分析')}<br><span class="muted">本次使用 ${result.materials?.length || 0} 份资料，生成 ${result.question_count || 0} 道题。</span></div><h4>核心考点</h4>${points || '<p class="service-gap">资料中未能提炼出结构化考点。</p>'}<h4>自测题</h4>${questions || '<p class="service-gap">资料中未能生成可核对的题目。</p>'}`;

/* ================= 语音输入 ================= */
let voiceRec = null, voiceOn = false;
function initVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;  // 浏览器不支持则保持按钮隐藏
  const btn = $('#voice-btn');
  btn.style.display = '';
  btn.title = '语音输入（点击开始/停止）';
  voiceRec = new SR();
  voiceRec.lang = 'zh-CN';
  voiceRec.interimResults = true;
  voiceRec.continuous = false;
  voiceRec.onresult = e => {
    let text = '';
    for (let i = e.resultIndex; i < e.results.length; i++) text += e.results[i][0].transcript;
    const input = $('#msg-input');
    input.value = text;
    input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 130) + 'px';
  };
  voiceRec.onend = () => { voiceOn = false; btn.classList.remove('listening'); btn.textContent = '🎤'; };
  voiceRec.onerror = ev => {
    voiceOn = false; btn.classList.remove('listening'); btn.textContent = '🎤';
    if (ev.error === 'not-allowed') toast('麦克风权限被拒绝，请在浏览器设置中允许', true);
    else if (ev.error !== 'no-speech' && ev.error !== 'aborted') toast('语音识别失败：' + ev.error, true);
  };
}
function toggleVoice() {
  if (!voiceRec) { toast('当前浏览器不支持语音输入', true); return; }
  const btn = $('#voice-btn');
  if (voiceOn) {
    voiceRec.stop();
    return;
  }
  try {
    voiceRec.start();
    voiceOn = true;
    btn.classList.add('listening'); btn.textContent = '⏹';
    toast('正在聆听，请说话…');
  } catch (e) { toast('无法启动语音识别', true); }
}

  const items = serviceItems.filter(item => [item.title, item.category, item.description, item.query].some(value => value.includes(q)));
  const grid = $('#service-grid');
  grid.innerHTML = items.map(item => `<button type="button" class="service-card" data-service="${esc(item.id).replace(/"/g, '&quot;')}" aria-pressed="${selectedService === item.id}"><span class="service-category">${esc(item.category)}</span><strong>${esc(item.title)}</strong><span>${esc(item.description)}</span></button>`).join('');
  if (!items.length) grid.textContent = '暂未找到这个事项，可在对话中描述你的需求。';
  grid.querySelectorAll('[data-service]').forEach(button => button.onclick = () => openService(button.dataset.service));
}
function contactsHtml(contacts) {
  return contacts.map(contact => `<div class="contact-item"><div class="contact-role">${esc(contact.department)} · ${esc(contact.role)}</div><p>电话：${esc(contact.phone)}<br>办公地址：${esc(contact.address || '未标注')}</p>${sourceRefsHtml([contact])}</div>`).join('');
}
async function loadColleges() {
  if (collegeItems.length) { renderColleges(); return; }
  const grid = $('#college-grid');
  if (!grid) return;
  grid.textContent = '正在加载学院列表…';
  try {
    collegeItems = await api('/api/colleges');
    renderColleges();
  } catch (e) {
    grid.textContent = '学院列表加载失败：' + e.message;
  }
}
function renderColleges() {
  const grid = $('#college-grid');
  if (!grid) return;
  grid.innerHTML = collegeItems.map(item => `<button type="button" class="college-card" data-college="${esc(item.id).replace(/"/g, '&quot;')}" aria-pressed="${selectedCollege === item.id}"><strong>${esc(item.name)}</strong></button>`).join('');
  grid.querySelectorAll('[data-college]').forEach(button => button.onclick = () => openCollege(button.dataset.college));
}
async function openCollege(id) {
  selectedCollege = id; renderColleges();
  const request = ++collegeRequest;
  const detail = $('#college-detail');
  if (!detail) return;
  detail.textContent = '正在查找学院资料和联系人…'; detail.setAttribute('aria-busy', 'true');
  try {
    const item = await api('/api/colleges/' + encodeURIComponent(id));
    if (request !== collegeRequest) return;
    const references = item.references?.length ? item.references.map(ref => `<p><strong>${esc(ref.title || '相关资料')}</strong></p><p class="service-excerpt">${esc(ref.content || '')}</p>${sourceRefsHtml([ref])}`).join('') : '<p class="service-gap">尚未找到该学院的可核对资料。</p>';
    const contacts = item.contacts?.length ? contactsHtml(item.contacts) : '<p class="service-gap">尚未找到该学院的官网联系人。</p>';
    detail.innerHTML = `<h3>${esc(item.name)}</h3><div class="service-note">${esc(item.notice || '')}</div><h4>已收录的学院资料</h4>${references}<h4>官网联系人</h4><div class="contacts-grid">${contacts}</div><p class="service-gap">${esc(item.missing || '')}</p>`;
  } catch (e) {
    if (request === collegeRequest) detail.textContent = '查询失败：' + e.message;
  } finally { if (request === collegeRequest) detail.setAttribute('aria-busy', 'false'); }
}
async function openService(id) {
  selectedService = id; filterServices();
  const request = ++serviceRequest;
  const detail = $('#service-detail'); detail.textContent = '正在查找相关资料和联系人…'; detail.setAttribute('aria-busy', 'true');
  try {
    const item = await api('/api/services/' + encodeURIComponent(id));
    if (request !== serviceRequest) return;
    detail.innerHTML = `<h3>${esc(item.title)}</h3><p>${esc(item.description)}</p><div class="service-note">${esc(item.notice)}</div><h4>已收录的相关资料</h4>${item.references.length ? item.references.map(ref => `<p><strong>${esc(ref.title)}</strong></p><p class="service-excerpt">${esc(ref.content)}</p>${sourceRefsHtml([ref])}`).join('') : '<p>尚未找到足以说明办理细则的资料。</p>'}<p class="service-gap">${esc(item.missing)}</p><h4>可咨询的联系人</h4>${item.contacts.length ? contactsHtml(item.contacts) : '<p class="service-gap">尚未核实专门受理此事项的联系人，请通过学校官方渠道确认。</p>'}<button type="button" class="btn" id="service-ask">向助手询问此事项</button>`;
    $('#service-ask').onclick = () => askService(item.query);
  } catch (e) {
    if (request === serviceRequest) detail.textContent = '查询失败：' + e.message;
  } finally { if (request === serviceRequest) detail.setAttribute('aria-busy', 'false'); }
}
async function searchContacts() {
  const q = $('#contact-query').value.trim();
  if (!q) return;
  const button = $('#contact-search-btn'); button.disabled = true;
  $('#contact-results').textContent = '正在查询官网号码簿…';
  try {
    const rows = await api('/api/contacts?q=' + encodeURIComponent(q));
    $('#contact-results').innerHTML = rows.length ? contactsHtml(rows) : '<p>未找到相关联系人。可以换用部门全称或岗位名称查询。</p>';
  } catch (e) { $('#contact-results').textContent = '查询失败：' + e.message; }
  finally { button.disabled = false; }
}
function askService(query) {
  if (state.sending) { toast('请等待当前回答完成后再提问'); return; }
  $('#msg-input').value = query + '。请区分已有依据和待确认事项，并提供原文来源。';
  sendMessage();
}

/* ================= 启动 ================= */
initTheme();
initVoice();
$('#chat-title').ondblclick = renameConversation;
loadConversations();
refreshKeyDot();

</script>
</body>
</html>
